name: Release

# A tag `vX.Y.Z` publishes a release; `vX.Y.Z-beta.1` (any suffix) publishes a
# pre-release. The tag must match the workspace and Android versions, so a
# release can never carry a different number than the binaries inside it.
# Run it by hand (Actions → Release → Run workflow) for a dry run: everything
# is built and uploaded as workflow artifacts, and nothing is published.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.check.outputs.name }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag against the versions in the tree
        id: check
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          android_version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts | head -1)
          test -n "$cargo_version" && test -n "$android_version"
          if [ "$cargo_version" != "$android_version" ]; then
            echo "Cargo.toml says $cargo_version but the Android app says $android_version" >&2
            exit 1
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
            case "$tag" in
              "v$cargo_version") prerelease=false ;;
              "v$cargo_version"-*) prerelease=true ;;
              *) echo "tag $tag does not match version $cargo_version" >&2; exit 1 ;;
            esac
            name="$tag"
          else
            name="v$cargo_version-dryrun"
            prerelease=true
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Releasing $name (prerelease: $prerelease)"

  build-linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # A tag should not be able to ship a known-vulnerable dependency: the
      # audit runs before the build, so a finding stops the release.
      - name: Security audit
        run: |
          cargo install cargo-audit
          cargo audit

      # The server links PipeWire/Wayland and, under the `encode` feature, libav*.
      - name: Install system dependencies
        # The runner's Microsoft package source has hung or failed this step
        # for an hour at a time; nothing here comes from it.
        timeout-minutes: 15
        run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod* && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update && sudo apt-get install -y libpipewire-0.3-dev libwayland-dev libegl1-mesa-dev libgbm-dev pkg-config libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev

      # Two builds, so the server's zbus `tokio` is not unified into the
      # window's: AccessKit runs zbus on async-io there (N10).
      - name: Build release binaries
        run: |
          cargo build --release --bin pocketdesk
          cargo build --release -p pocketdesk-desktop --bin pocketdesk-app --bin pocketdesk-tray

      - name: Run tests
        run: cargo test --workspace

      - name: Create release archive
        run: |
          name="pocketdesk-${{ needs.version.outputs.name }}-linux-x86_64"
          mkdir -p "release/$name"
          cp target/release/pocketdesk target/release/pocketdesk-app target/release/pocketdesk-tray "release/$name/"
          cp config.toml.example pocketdesk.service README.md SECURITY.md LICENSE-MIT LICENSE-APACHE "release/$name/"
          cp -r man "release/$name/"
          tar -C release -czf "release/$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: release/pocketdesk-*.tar.gz

  # The Windows server and the desktop app are self-contained exes importing
  # only system DLLs and the Windows 10+ UCRT. FFmpeg is not bundled (the
  # encoder sidecar finds it on PATH; the README says how to get it).
  build-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The GNU host toolchain, as on the dev box: it builds without a Windows
      # SDK, which is why AGENTS.md's Windows gates name this target.
      - name: Install Rust (x86_64-pc-windows-gnu)
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal --component clippy,rustfmt
          rustup default stable-x86_64-pc-windows-gnu

      # MSYS2's UCRT64 gcc, CMake and NASM: the C parts (aws-lc, Opus) need a
      # MinGW compiler and CMake.
      - name: Install MinGW (gcc, CMake, NASM)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-nasm

      - name: Put MinGW on PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --bin pocketdesk --bin pocketdesk-app --bin pocketdesk-tray

      - name: Run tests
        run: cargo test --workspace --exclude pocketdesk-android-bridge --exclude iroh-spike

      - name: Create release archive
        shell: pwsh
        run: |
          $name = "pocketdesk-${{ needs.version.outputs.name }}-windows-x86_64"
          New-Item -ItemType Directory -Force "release/$name" | Out-Null
          Copy-Item target/release/pocketdesk.exe, target/release/pocketdesk-app.exe, target/release/pocketdesk-tray.exe, config.toml.example, README.md, SECURITY.md, LICENSE-MIT, LICENSE-APACHE "release/$name/"
          Compress-Archive -Path "release/$name" -DestinationPath "release/$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/pocketdesk-*.zip

  # The phone app. With signing secrets set (ANDROID_KEYSTORE_BASE64,
  # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) it is a
  # release build signed with that key; without them it is the debug build,
  # named as such, so nobody mistakes it for a store-signed app.
  build-android:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (with the Android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install platform, build-tools and NDK
        run: |
          (yes || true) | sdkmanager --install "platforms;android-37.0" "build-tools;36.1.0" >/dev/null
          NDK=$(cat android/bridge/ndk-version)
          (yes || true) | sdkmanager --install "ndk;$NDK" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk and the bridge's pinned Rust
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked
          rustup toolchain install "$(cat android/bridge/rust-toolchain-version)" \
            --profile minimal --target aarch64-linux-android

      - name: Build the arm64 bridge
        run: sh android/bridge/build-android.sh

      - name: Build the APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p ../release
          base="pocketdesk-${{ needs.version.outputs.name }}-android-arm64"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            ./gradlew assembleRelease --no-daemon
            BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
            # AGP's output is already aligned (the native library to 16 KB
            # pages). apksigner from build-tools 35 on re-aligns by default,
            # with its own padding, which moves every entry and makes the
            # signed APK differ from F-Droid's unsigned build of the same
            # source: --alignment-preserved keeps AGP's layout as it is.
            "$BT/apksigner" sign --alignment-preserved true \
              --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
              --out "../release/$base.apk" app/build/outputs/apk/release/app-release-unsigned.apk
            # Proof: every entry where AGP put it, with the same padding.
            python3 - app/build/outputs/apk/release/app-release-unsigned.apk "../release/$base.apk" <<'PY'
          import sys, zipfile
          def layout(path):
              with zipfile.ZipFile(path) as z:
                  return {i.filename: (i.header_offset, i.extra) for i in z.infolist()
                          if not i.filename.startswith("META-INF/")}
          unsigned, signed = layout(sys.argv[1]), layout(sys.argv[2])
          moved = [name for name in unsigned if signed.get(name) != unsigned[name]]
          sys.exit(f"signing moved {len(moved)} entries, e.g. {moved[:3]}" if moved else 0)
          PY
            "$BT/zipalign" -c -P 16 -v 4 "../release/$base.apk" > /dev/null
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "../release/$base-debug-signed.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: release/pocketdesk-*.apk

  publish:
    needs: [version, build-linux, build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum pocketdesk-* > SHA256SUMS && cat SHA256SUMS

      # A dry run stops here: the files are in the workflow's artifacts.
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'push'
        with:
          name: release-dry-run
          path: dist/*

      - name: Publish the release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: Pocketdesk ${{ needs.version.outputs.name }}
          body_path: .github/release-notes.md
          generate_release_notes: true
          prerelease: ${{ needs.version.outputs.prerelease }}
          files: |
            dist/pocketdesk-*
            dist/SHA256SUMS
