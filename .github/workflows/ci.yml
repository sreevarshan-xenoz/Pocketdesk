name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# The gates are the ones docs/AGENTS.md runs by hand (roadmap Phase 1 step 2): every
# `core` feature profile the Android bridge and the server actually build with,
# and the Kotlin app. They used to live only in discipline, which is how `main`
# sat red at `cargo fmt --check` for six pushes. `audit` is deliberately able to
# fail the run — the old `|| echo` made a dependency finding unactionable.
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Keep the packages apt fetched between runs: the mirror has been
      # slow enough to run past the step's 30 minutes.
      - name: Keep apt's packages between runs
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ github.job }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-${{ runner.os }}-${{ github.job }}-
      - name: Install system dependencies
        # The runner's Microsoft package source has hung or failed this step
        # for an hour at a time; nothing here comes from it. Recommends are left
        # out: the slow mirror took 15 minutes on them alone.
        timeout-minutes: 30
        run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod* && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update && mkdir -p ~/apt-archives/partial && sudo apt-get -o Dir::Cache::Archives=$HOME/apt-archives install -y --no-install-recommends libpipewire-0.3-dev libwayland-dev libegl1-mesa-dev libgbm-dev pkg-config libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev && sudo chown -R "$USER" ~/apt-archives

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      # C6: the owed checks by where they can run, generated from the checklist.
      - name: Owed checks index
        run: python3 scripts/owed_checks.py --selftest && python3 scripts/owed_checks.py --check

      # N1: the device checks runner's pure parts (the checks need a phone).
      - name: Device checks runner
        run: python3 -m unittest scripts/test_device_checks.py

      - name: Clippy (workspace, all targets)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --release

      # N10: zbus with `tokio` panics AccessKit's thread in the window, so
      # the desktop crate keeps it on async-io (the release builds it apart
      # from the server).
      - name: The desktop's zbus stays on async-io
        run: |
          if cargo tree -p pocketdesk-desktop -e features -i zbus | grep -q 'zbus feature "tokio"'; then
            echo "pocketdesk-desktop pulls zbus with tokio"; exit 1
          fi

      # The test-harness feature turns a test binary's state and config to
      # throwaway folders; only test builds ([dev-dependencies]) may have it,
      # never what a release, a package or the Android bridge builds.
      - name: Core's test-harness stays out of normal builds
        run: |
          if cargo tree --target all -p pocketdesk-server -p pocketdesk-desktop -p pocketdesk-android-bridge -e features,normal,build -i pocketdesk-core | grep -q 'feature "test-harness"'; then
            echo "a normal build turns on pocketdesk-core's test-harness"; exit 1
          fi

      - name: Test
        run: cargo test --workspace

  # `core` is compiled under four different feature sets — the server default,
  # and three the bridge/WAN/encode paths use — and a cfg mistake in one is
  # invisible to the others, so each profile gets its own job.
  profiles:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: client (Android bridge core)
            features: client
          - name: client + wan (Android bridge, WAN enabled)
            features: client,wan
          - name: wan (iroh paths)
            features: wan
          - name: encode (capture + encoder paths)
            features: encode
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Keep the packages apt fetched between runs: the mirror has been
      # slow enough to run past the step's 30 minutes.
      - name: Keep apt's packages between runs
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ github.job }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-${{ runner.os }}-${{ github.job }}-
      - name: Install system dependencies
        # The runner's Microsoft package source has hung or failed this step
        # for an hour at a time; nothing here comes from it. Recommends are left
        # out: the slow mirror took 15 minutes on them alone.
        timeout-minutes: 30
        run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod* && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update && mkdir -p ~/apt-archives/partial && sudo apt-get -o Dir::Cache::Archives=$HOME/apt-archives install -y --no-install-recommends libpipewire-0.3-dev libwayland-dev libegl1-mesa-dev libgbm-dev pkg-config libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev && sudo chown -R "$USER" ~/apt-archives

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy (${{ matrix.features }})
        run: cargo clippy -p pocketdesk-core --no-default-features --features ${{ matrix.features }} --all-targets -- -D warnings

      - name: Tests (${{ matrix.features }})
        if: matrix.features == 'wan' || matrix.features == 'encode'
        run: cargo test -p pocketdesk-core --features ${{ matrix.features }}

  # The Windows host (W0-W5, feat/windows-host). The Android bridge and the
  # iroh spike are not Windows targets. Live tests — GPU encoders, capture,
  # SendInput, toasts, power — are #[ignore]d: a hosted runner has no desktop
  # session or GPU, so they stay owed to a real machine (checklist §23). The
  # suite needs no FFmpeg; only those ignored tests do.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The GNU host toolchain, as on the dev box: it builds without a Windows
      # SDK, which is why docs/AGENTS.md's Windows gates name this target.
      - name: Install Rust (x86_64-pc-windows-gnu)
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal --component clippy,rustfmt
          rustup default stable-x86_64-pc-windows-gnu

      # MSYS2's UCRT64 gcc, CMake and NASM stand in for the WinLibs build used
      # locally: the C parts (aws-lc, Opus) need a MinGW compiler and CMake.
      - name: Install MinGW (gcc, CMake, NASM)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-nasm

      - name: Put MinGW on PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (workspace, all targets)
        run: cargo clippy --workspace --all-targets --exclude pocketdesk-android-bridge --exclude iroh-spike -- -D warnings

      # The desktop snapshots' renderer builds on Windows only while the lock
      # gives gpu-allocator the windows crate wgpu-hal uses (C4 review).
      - name: Clippy (desktop with snapshots)
        run: cargo clippy -p pocketdesk-desktop --all-targets --features snapshots -- -D warnings

      - name: Test
        run: cargo test --workspace --exclude pocketdesk-android-bridge --exclude iroh-spike

  # The bridge .so is gitignored, so the app build has to produce it first —
  # assembleDebug alone would link whatever stale binary was last copied in,
  # which is exactly the artifact that hid a broken video link on device.
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (with the Android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      # Keep the packages apt fetched between runs: the mirror has been
      # slow enough to run past the step's 30 minutes.
      - name: Keep apt's packages between runs
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ github.job }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-${{ runner.os }}-${{ github.job }}-
      - name: Install system dependencies
        # The runner's Microsoft package source has hung or failed this step
        # for an hour at a time; nothing here comes from it. Recommends are left
        # out: the slow mirror took 15 minutes on them alone.
        timeout-minutes: 30
        run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod* && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update && mkdir -p ~/apt-archives/partial && sudo apt-get -o Dir::Cache::Archives=$HOME/apt-archives install -y --no-install-recommends libpipewire-0.3-dev libwayland-dev libegl1-mesa-dev libgbm-dev pkg-config libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev && sudo chown -R "$USER" ~/apt-archives

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default also asks for `tools`, which current command-line tools
          # no longer ship, so sdkmanager exited 1 and the job never built.
          packages: platform-tools

      - name: Install platform, build-tools and NDK
        run: |
          # Platform 37 has its own licence prompt. `(yes || true)` because the
          # step runs under pipefail and `yes` dies of SIGPIPE when sdkmanager ends.
          (yes || true) | sdkmanager --install "platforms;android-37.0" "build-tools;36.1.0" >/dev/null
          # The NDK the bridge is built with, pinned beside it, the same as
          # F-Droid's recipe uses.
          NDK=$(cat android/bridge/ndk-version)
          (yes || true) | sdkmanager --install "ndk;$NDK" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK" >> "$GITHUB_ENV"
          echo "installed ndk;$NDK"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk and the bridge's pinned Rust
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked
          rustup toolchain install "$(cat android/bridge/rust-toolchain-version)" \
            --profile minimal --target aarch64-linux-android

      - name: Bridge clippy (host target)
        run: cargo clippy -p pocketdesk-android-bridge --all-targets -- -D warnings

      - name: Build the arm64 bridge
        run: sh android/bridge/build-android.sh

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # The instrumented tests need a device, so CI only compiles them.
      - name: Compile instrumented tests
        working-directory: android
        run: ./gradlew assembleDebugAndroidTest --no-daemon

      - name: Android Lint
        working-directory: android
        run: ./gradlew lintDebug --no-daemon

  # Phase 1 step 4: the pinned encoder clip measured against a committed
  # baseline. A hosted runner's CPU is not the machine the baselines in
  # bench/baselines were recorded on, so the expected outcome today is SKIP
  # (exit 3) naming the host it did find — which is the honest answer, not a
  # pass. The job turns red only on a tail regression past the threshold. To
  # make it gate on a new machine class, run the same command there with
  # `--record bench/baselines` and commit the file it writes (the artifact
  # below is exactly that file, for this runner class).
  bench:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Keep the packages apt fetched between runs: the mirror has been
      # slow enough to run past the step's 30 minutes.
      - name: Keep apt's packages between runs
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ github.job }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-${{ runner.os }}-${{ github.job }}-
      - name: Install system dependencies
        # The runner's Microsoft package source has hung or failed this step
        # for an hour at a time; nothing here comes from it. Recommends are left
        # out: the slow mirror took 15 minutes on them alone.
        timeout-minutes: 30
        run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod* && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update && mkdir -p ~/apt-archives/partial && sudo apt-get -o Dir::Cache::Archives=$HOME/apt-archives install -y --no-install-recommends libpipewire-0.3-dev libwayland-dev libegl1-mesa-dev libgbm-dev pkg-config libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev && sudo chown -R "$USER" ~/apt-archives

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build the CLI
        run: cargo build --release -p pocketdesk-server --bin pocketdesk

      - name: Encoder benchmark against the committed baseline
        shell: bash
        run: |
          set +e
          ./target/release/pocketdesk bench \
            --target software --repeat 3 --tolerance-pct 50 \
            --baseline bench/baselines --record "$RUNNER_TEMP/bench"
          code=$?
          case $code in
            0) echo "bench: pass"; exit 0 ;;
            3) echo "bench: skipped — no baseline for this runner (see the log above)"; exit 0 ;;
            1) echo "bench: REGRESSION past the 50% threshold"; exit 1 ;;
            *) echo "bench: could not run (exit $code)"; exit 1 ;;
          esac

      - name: Upload the measured record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encoder-baseline-software
          path: '${{ runner.temp }}/bench/*.json'
          if-no-files-found: ignore

  # C4: the desktop app's pages in both themes, drawn by Mesa's software
  # Vulkan (lavapipe), where the committed pictures were made, and compared
  # with them. With none committed it draws them, uploads them and fails, so
  # a missing set never passes; a changed picture uploads the new image and
  # its difference.
  # Pinned: a new image's Mesa draws text a little differently.
  snapshots:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Keep the packages apt fetched between runs: the mirror has been
      # slow enough to run past the step's 30 minutes.
      - name: Keep apt's packages between runs
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ github.job }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-${{ runner.os }}-${{ github.job }}-
      - name: Install system dependencies
        # The runner's Microsoft package source has hung or failed this step
        # for an hour at a time; nothing here comes from it. Recommends are left
        # out: the slow mirror took 15 minutes on them alone.
        timeout-minutes: 30
        run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod* && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update && mkdir -p ~/apt-archives/partial && sudo apt-get -o Dir::Cache::Archives=$HOME/apt-archives install -y --no-install-recommends libpipewire-0.3-dev libwayland-dev libegl1-mesa-dev libgbm-dev pkg-config libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev mesa-vulkan-drivers && sudo chown -R "$USER" ~/apt-archives

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy (with snapshots)
        run: cargo clippy -p pocketdesk-desktop --all-targets --features snapshots -- -D warnings

      - name: Snapshots
        run: |
          if ls desktop/tests/snapshots/*_light.png >/dev/null 2>&1; then
            cargo test -p pocketdesk-desktop --features snapshots snapshots
          else
            UPDATE_SNAPSHOTS=1 cargo test -p pocketdesk-desktop --features snapshots snapshots
            echo "::error::No snapshots were committed: drew them (see the artifact); commit them to desktop/tests/snapshots/."
            exit 1
          fi

      - name: Upload the pictures drawn
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-snapshots
          path: desktop/tests/snapshots/
          if-no-files-found: ignore

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      # No `|| echo`: a known-vulnerable dependency has to be able to stop a
      # release, which is the only way this step has ever been informative.
      - name: Run security audit
        run: cargo audit
