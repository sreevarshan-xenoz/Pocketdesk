name: Fuzz (nightly)

# Item 6: every fuzz target (fuzz/, scripts/fuzz.sh) for 5 minutes a night,
# its corpus kept between nights so each run starts where the last one got
# to. A crash fails the run and its input is uploaded; make it a unit test
# and fix it. PR CI runs each target for 30 s (ci.yml's `fuzz`), from the
# build cache this keeps.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FUZZ_TOOLCHAIN: nightly-2026-10-15

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-15

      - name: Keep apt's packages between runs
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-fuzz-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-${{ runner.os }}-fuzz-
      - name: Install system dependencies
        timeout-minutes: 30
        run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod* && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update && mkdir -p ~/apt-archives/partial && sudo apt-get -o Dir::Cache::Archives=$HOME/apt-archives install -y --no-install-recommends libpipewire-0.3-dev libwayland-dev libegl1-mesa-dev libgbm-dev pkg-config libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev && sudo chown -R "$USER" ~/apt-archives

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
          shared-key: fuzz

      - name: Keep the corpus between nights
        uses: actions/cache@v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Fuzz every target for 5 minutes
        run: scripts/fuzz.sh 300

      - name: Upload the inputs that crashed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ github.run_id }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
