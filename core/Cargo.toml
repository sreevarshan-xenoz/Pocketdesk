[package]
name = "linux-link-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["server"]

# Desktop server features (Linux and Windows; the backends differ by target)
server = ["capture", "encode", "injection", "opus"]
capture = [
    "dep:ashpd",
    "dep:pipewire",
    "dep:libspa",
    "dep:x11rb",
    "dep:xcap",
    "dep:wayland-client",
    "dep:wayland-protocols-wlr",
    "dep:wayland-scanner",
    "dep:wayland-backend",
    "dep:bitflags",
    "wayland-portal",
]
encode = ["dep:ffmpeg-sidecar", "dep:ffmpeg-next"]
injection = ["dep:evdev"]
wayland-portal = ["ashpd?/screencast"]
x11-capture = ["dep:xcap"]

# Client-only (Android) features
client = []

# WAN transport (R1 stage 2): iroh (noq) implementation of the streaming
# connection traits. Opt-in so neither the default build nor the Android
# bridge pulls iroh into the graph.
wan = ["dep:iroh"]

# The files the server and the desktop app share (config, pairing PIN, live
# sessions, identity): `core::local`. No tokio, no transport.
local = ["dep:toml", "dep:toml_edit", "dep:base64"]

[dependencies]
anyhow.workspace = true
base64 = { version = "0.22", optional = true }
toml = { version = "0.8", optional = true }
toml_edit = { version = "0.22", optional = true }
serde.workspace = true
tokio.workspace = true
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing.workspace = true
uuid.workspace = true
async-trait.workspace = true
rand = "0.8"
tokio-util.workspace = true
# The control channel inside TLS (phase B); ring, as the rest of the tree.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }

# Audio coding (Opus). Server: desktop-audio encode + phone-mic decode (R4 E2).
# The Android bridge deliberately does NOT enable it (CMake cross-compile);
# the phone encodes mic audio with MediaCodec instead.
opus = { workspace = true, optional = true }

# Video encoding through a persistent ffmpeg child process (both OSes)
ffmpeg-sidecar = { workspace = true, optional = true }

# mDNS service discovery
mdns-sd = "0.13"

# Certificate hashing for TOFU verification
sha2 = "0.10"

# Unix-specific utilities
libc.workspace = true

# QUIC streaming
quinn.workspace = true

# WAN QUIC streaming via iroh (behind the `wan` feature)
iroh = { version = "1.2", optional = true }

# TLS and certificates for QUIC
rcgen.workspace = true
rustls.workspace = true

# X11 screen capture fallback (optional)
xcap = { workspace = true, optional = true }

# Directories / home paths
dirs.workspace = true

# Linux-only backends. The features above name them with `dep:`; on another
# OS the dependency does not exist for the target, so the feature turns on
# nothing and the code behind it is `cfg(target_os = "linux")`.
[target.'cfg(target_os = "linux")'.dependencies]
# Screen capture
ashpd = { workspace = true, optional = true }
pipewire = { workspace = true, optional = true }
libspa = { workspace = true, optional = true }
x11rb = { version = "0.13", features = ["shm"], optional = true }
wayland-client = { version = "0.31", optional = true }
wayland-protocols-wlr = { version = "0.3", default-features = false, features = [
    "client",
], optional = true }
# R4 B2: in-crate code generation for hyprland-toplevel-export-v1
# (core/protocols/*.xml, BSD-3 vendored). Generated bindings reference
# `wayland_backend` and `bitflags` directly, so they must be in scope.
wayland-scanner = { version = "0.31", optional = true }
wayland-backend = { version = "0.3", optional = true }
bitflags = { version = "2", optional = true }
# In-process FFmpeg (software x264 + VAAPI). Windows encodes through the
# ffmpeg sidecar only; see docs/superpowers/specs/2026-10-08-windows-host-design.md §4.
ffmpeg-next = { workspace = true, optional = true }
# Input injection via uinput
evdev = { workspace = true, optional = true }

# Windows: capture backends, and owner-only file ACLs (secure_fs) on every
# Windows build.
[target.'cfg(windows)'.dependencies]
windows.workspace = true

# Adapter enumeration for get_local_ips() off Linux (no `hostname -I`); already
# in the graph through mdns-sd.
[target.'cfg(not(target_os = "linux"))'.dependencies]
if-addrs = "0.13"
