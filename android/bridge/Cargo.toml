[package]
name = "pocketdesk-android-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
# `opus` deliberately NOT enabled: audiopus_sys builds libopus via CMake,
# which does not cross-compile cleanly under cargo-ndk here. The R4 E2 mic
# path encodes Opus on the Kotlin side (MediaCodec c2.android.opus.encoder)
# and sends finished packets through `send_mic_frame`.
pocketdesk-core = { path = "../../core", default-features = false, features = ["client", "wan"] }
jni = "0.21"
anyhow.workspace = true
tokio = { workspace = true, features = ["fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json = "1"
quinn.workspace = true
tokio-util.workspace = true
# File transfers run inside TLS (phase C).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
uuid.workspace = true
# Source ids for resumable transfers (T6a).
sha2 = "0.10"

[dev-dependencies]
async-trait.workspace = true
# A desktop's end of the internet road in tests (T10a).
iroh = "1.2"
