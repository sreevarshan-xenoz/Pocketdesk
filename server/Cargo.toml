[package]
name = "linux-link-server"
version.workspace = true
edition.workspace = true

[lib]
name = "linux_link_server"
path = "src/lib.rs"

[[bin]]
name = "linux-link"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
linux-link-core = { path = "../core", features = ["wan"] }
serde.workspace = true
tokio = { workspace = true, features = ["fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true
toml = "0.8"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"

# Input handling
enigo.workspace = true

# QUIC streaming
quinn.workspace = true
# WAN (iroh) streaming endpoint — R1 stage 3
iroh = "1.2"

# Cancellation tokens and utilities
tokio-util.workspace = true

# UUID for persistent device ID
uuid.workspace = true
dashmap = "6.1.0"
xcap.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# D-Bus for notifications, battery
zbus.workspace = true
# Input injection via uinput (universal fallback)
evdev.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[dev-dependencies]
rustls.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
# `dup2` in the uinput rebuild test, to fault a live device's descriptor.
libc.workspace = true
