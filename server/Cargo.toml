[package]
name = "pocketdesk-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "pocketdesk_server"
path = "src/lib.rs"

[[bin]]
name = "pocketdesk"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
pocketdesk-core = { path = "../core", features = ["wan", "local"] }
serde.workspace = true
# Same version core already uses: the OS CSPRNG for pairing PINs.
rand = "0.8"
tokio = { workspace = true, features = ["fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true
# Daily-rolling log files for `start --background`
tracing-appender = "0.2"
dirs.workspace = true
clap = { version = "4", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"

# Input handling
enigo.workspace = true

# QUIC streaming
quinn.workspace = true
# WAN (iroh) streaming endpoint — R1 stage 3
# unstable-net-report: the NAT and UDP facts the Diagnostics tab shows (N1).
# Pinned to 1.2.x: unstable-net-report is outside semver.
iroh = { version = "~1.2", features = ["unstable-net-report"] }

# Cancellation tokens and utilities
tokio-util.workspace = true
# The control channel runs inside TLS (phase B).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }

# UUID for persistent device ID
uuid.workspace = true
dashmap = "6.1.0"
xcap.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# D-Bus for notifications, battery
zbus.workspace = true
# Input injection via uinput (universal fallback)
evdev.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true
# The `#[interface]` macro (IPolicyConfig) expands to `::windows_core` paths.
windows-core = "0.62"

[dev-dependencies]
rustls.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
# `dup2` in the uinput rebuild test, to fault a live device's descriptor.
libc.workspace = true
