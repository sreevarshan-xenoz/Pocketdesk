[package]
name = "pocketdesk-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "pocketdesk_server"
path = "src/lib.rs"

[[bin]]
name = "pocketdesk"
path = "src/main.rs"

[dependencies]
# Notifications' icons and pictures come as base64 (K3).
base64 = "0.22"
anyhow.workspace = true
# Core's `inproc` (the in-process Linux encoders) comes through this crate's
# own default feature, so the portable tarball can build without it.
pocketdesk-core = { path = "../core", default-features = false, features = ["server", "wan", "local"] }
serde.workspace = true
# Same version core already uses: the OS CSPRNG for pairing PINs.
rand = "0.8"
tokio = { workspace = true, features = ["fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true
# Daily-rolling log files for `start --background`
tracing-appender = "0.2"
dirs.workspace = true
clap = { version = "4", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"

# Input handling
enigo.workspace = true

# QUIC streaming
quinn.workspace = true
# WAN (iroh) streaming endpoint — R1 stage 3
# unstable-net-report: the NAT and UDP facts the Diagnostics tab shows (N1).
# Pinned to 1.3.x: unstable-net-report is outside semver.
iroh = { version = "~1.3", features = ["unstable-net-report"] }
# N2: run your own relay (`pocketdesk relay`).
iroh-relay = { version = "~1.3", features = ["server"] }
# N3: publish this desktop on the Mainline DHT (pkarr), no server of anyone's.
iroh-mainline-address-lookup = "0.6"
# Reading the DHT lookup's answer stream (already in the graph through iroh).
futures-lite = "2"
# Relay hosts in the DHT record (N3).
url = "2"
# Clipboard images (N4): PNG on the wire, DIB for Windows apps.
png = "0.18"
# O7: a received JPEG goes onto the clipboard as PNG.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# The clipboard image id: SHA-256 (already in the graph through rustls).
ring = "0.17"

# Cancellation tokens and utilities
tokio-util.workspace = true
# A Unix socket connect with a time limit (Hyprland's socket, which a
# frozen compositor stops accepting on).
socket2 = { version = "0.6", features = ["all"] }
# The control channel runs inside TLS (phase B).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
# A KDE Connect device's certificate names its id, and this computer has one
# of its own for them (3a).
x509-parser = "0.18"
rcgen.workspace = true

# UUID for persistent device ID
uuid.workspace = true
# Images sent from the browser (ecosystem 1d); the version core already uses.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# The inbox folders watched, not polled (R6c); CC0-1.0.
notify = { version = "8.2", default-features = false }
# Home Assistant over MQTT (ecosystem 1e): plain TCP, no TLS stack of its own.
rumqttc = { version = "0.25", default-features = false }
dashmap = "6.1.0"
# BK10: whether the computer driven is on this computer's own network,
# before a byte goes to it; already in the graph through core.
if-addrs = "0.13"
xcap.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# D-Bus for notifications, battery
zbus.workspace = true
# Input injection via uinput (universal fallback)
evdev.workspace = true
# X11's clipboard changes (T2): XFixes selection events.
x11rb = { version = "0.13", features = ["xfixes"] }
# The shared keyboard and mouse's badge on wlroots compositors: a
# layer-shell surface (the versions core's laser dot uses), its words drawn
# with ab_glyph (pure Rust, Apache-2.0) in a memfd buffer.
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", default-features = false, features = ["client"] }
# This computer's screens from xdg-output where neither Hyprland's IPC nor
# X can say them (BK8 live: sway without Xwayland); the version core's
# laser dot uses.
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
ab_glyph = "0.2"
libc.workspace = true
# Driving from Linux (BK8): the input-capture portal (ashpd, MIT) and its
# libei stream, received in pure Rust (reis, MIT; no C libei).
ashpd = { workspace = true, features = ["input_capture"] }
reis = { version = "0.7.1", features = ["tokio"] }

[target.'cfg(windows)'.dependencies]
windows.workspace = true
# The `#[interface]` macro (IPolicyConfig) expands to `::windows_core` paths.
windows-core = "0.62"
# The media session calls wait with a deadline (`IAsyncOperation::Status`).
windows-future = "0.3"

[dev-dependencies]
# Tests never reach the owner's state or config folder (core `test-harness`).
pocketdesk-core = { path = "../core", default-features = false, features = ["test-harness"] }
rustls.workspace = true
# A local Mainline DHT for the N3 publishing test (no internet).
n0-mainline = "0.7"
# The browser extension's id from its key (ecosystem 1d); versions core uses.
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dev-dependencies]
# `dup2` in the uinput rebuild test, to fault a live device's descriptor.
libc.workspace = true

[features]
default = ["inproc"]
# The in-process Linux encoders, linking the build machine's FFmpeg libraries.
# The release tarball builds with `--no-default-features` and encodes through
# the system `ffmpeg` program instead, so it runs on any FFmpeg major.
inproc = ["pocketdesk-core/inproc"]
# BG8: the in-process Windows encoder (needs FFmpeg's development files to
# build and its DLLs to run; docs/development-setup.md).
inproc-windows = ["pocketdesk-core/inproc-windows"]

# `cargo fuzz` builds with `--cfg fuzzing` (the entry points in
# `src/fuzzing.rs`, for `fuzz/`).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
