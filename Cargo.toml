[workspace]
resolver = "2"
members = [
    "core",
    "server",
    "desktop",
    "android/bridge",
    "spike/iroh",
]
# BG8: built only through core's `inproc-windows` (it needs FFmpeg's
# development files).
exclude = ["ffmpeg-shim"]

[workspace.package]
version = "0.8.0"
edition = "2024"
# The oldest Rust that builds the workspace: the desktop app's egui 0.36
# needs 1.95 (iroh, for the server and the bridge, needs 1.91).
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "process", "sync", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# XDG Desktop Portal (screen capture, input)
ashpd = { version = "0.13", features = ["screencast", "remote_desktop", "tokio"] }

# Video encoding
ffmpeg-sidecar = { version = "2.5", default-features = false, features = [] }
ffmpeg-next = "9"

# QUIC streaming
quinn = "0.11"

# TLS and certificates for QUIC
rcgen = "0.14"
rustls = "0.23"

# Input handling
enigo = { version = "0.6", features = ["x11rb"] }

# Input injection via uinput (universal fallback)
evdev = "0.13"

# X11 screen capture fallback
xcap = "0.9"

# D-Bus for notifications, battery, etc.
zbus = { version = "5.7", features = ["tokio"] }

# Opus audio codec
opus = "0.3"

# UUID
uuid = { version = "1", features = ["v4"] }

# Async trait
async-trait = "0.1"

# PipeWire screen capture
pipewire = "0.9"
libspa = "0.9"
tokio-util = "0.7"

# Unix-specific utilities
libc = "0.2"

# Directories / home paths
dirs = "5"

# Windows backends (capture, encode probe, input, audio, plugins). Only the
# API families the Windows host uses are enabled.
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Graphics_Capture",
    "Graphics_DirectX",
    "ApplicationModel",
    "Graphics_DirectX_Direct3D11",
    "Media_Control",
    "Storage",
    "Storage_Streams",
    "UI_Notifications",
    "UI_Notifications_Management",
    "Data_Xml_Dom",
    "Win32_Foundation",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_Multimedia",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_Shutdown",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_TaskScheduler",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
