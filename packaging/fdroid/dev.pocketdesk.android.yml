# Pocketdesk's metadata for F-Droid (fdroiddata's metadata/dev.pocketdesk.android.yml),
# modelled on Ruffle and Fatto (Rust through cargo-ndk, developer-signed). A draft, not yet
# run through fdroid lint or fdroid build on F-Droid's build server: opening the merge
# request, and running those there, is the owner's call (packaging/README.md).
Categories:
  - Connectivity
  - File Transfer
  - Remote Access
# The code is MIT OR Apache-2.0; fdroiddata takes one SPDX id.
License: MIT
AuthorName: sreevarshan-xenoz
SourceCode: https://github.com/sreevarshan-xenoz/Pocketdesk
IssueTracker: https://github.com/sreevarshan-xenoz/Pocketdesk/issues
Changelog: https://github.com/sreevarshan-xenoz/Pocketdesk/releases

AutoName: Pocketdesk

RepoType: git
Repo: https://github.com/sreevarshan-xenoz/Pocketdesk.git
# The release's own APK: F-Droid builds the same bytes (the Reproducible APK workflow
# checks it across machines) and ships the developer's signature.
Binaries: https://github.com/sreevarshan-xenoz/Pocketdesk/releases/download/v%v/pocketdesk-v%v-android-arm64.apk

Builds:
  - versionName: 0.7.0
    versionCode: 7
    commit: 5570c80420921aee878068ca07844f84b8570b1e
    subdir: android/app
    # Rust from Debian's rustup, as fdroiddata asks (MR !54623): the
    # toolchain pinned in the repo, the Android target, cargo-ndk 4.1.2,
    # then the bridge as CI builds it. The build server's own JDK.
    sudo:
      - apt-get update
      - apt-get install -y cmake gcc libc-dev rustup
    gradle:
      - yes
    prebuild:
      - rustup set profile minimal
      - rustup default "$(cat ../bridge/rust-toolchain-version)"
      - rustup target add aarch64-linux-android
      - cargo install cargo-ndk@4.1.2 --locked
    # The library is built in `build`, after F-Droid's scan: built in
    # `prebuild`, its own target/ output failed the scan (MR !54623).
    build:
      - export ANDROID_NDK_HOME=$$NDK$$
      - sh ../bridge/build-android.sh
    ndk: 29.0.14206865

# The release key's certificate (SHA-256), as apksigner prints it.
AllowedAPKSigningKeys: 3a2452b38b4be5ac8493b330a91ed5a43e8490e6c74b8a7934599bc5e8ac3a0f

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
CurrentVersion: 0.7.0
CurrentVersionCode: 7
