[package]
name = "pocketdesk-desktop"
description = "Pocketdesk desktop app: pair phones, manage sessions and settings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
# `cargo run -p pocketdesk-desktop` runs the window, as before E2.
default-run = "pocketdesk-app"

[[bin]]
name = "pocketdesk-app"
path = "src/main.rs"

# The tray on its own, with no window (E2).
[[bin]]
name = "pocketdesk-tray"
path = "src/tray_main.rs"

[dependencies]
pocketdesk-core = { path = "../core", default-features = false, features = ["local"] }
eframe = { version = "0.36", default-features = false, features = ["accesskit", "glow", "default_fonts", "persistence", "x11", "wayland"] }
qrcode = { version = "0.14", default-features = false }
# System fonts for other scripts, mapped rather than read (fonts.rs).
memmap2 = "0.9"
# Each font is parsed as epaint parses it before it is added: one that
# does not parse would panic the app at its first frame.
skrifa = "0.44"
serde_json = "1"
# The phone's recent photos (C7): thumbnails, and a photo to copy.
# The phone window's screenshots and recordings (L5) go where the system keeps
# pictures and videos (OneDrive's moved folders, localized XDG ones).
dirs.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

# C4: the snapshots need a GPU renderer; a feature, so the usual test run
# does not build one (a feature cannot turn on a dev-dependency's features).
# On Windows it builds only while Cargo.lock gives gpu-allocator windows
# 0.62, the version wgpu-hal hands it (CI's Windows job checks).
egui_kittest = { version = "=0.36.2", optional = true, features = ["eframe", "snapshot", "wgpu"] }

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[target.'cfg(windows)'.dev-dependencies]
# The media controls' live test waits on WinRT calls (K7), as the server does.
windows-future = "0.3"
# N2: the live test names its cover as the phone does.
sha2 = "0.10"
# PC5: the NV12 shader's test opens its window off the main thread.
winit = { version = "0.30", default-features = false }

# The tray. tray-icon's Linux backend needs a GTK main loop the app does not
# run, so Linux has its own (src/tray_linux.rs): a StatusNotifierItem over
# D-Bus, no GTK (N6).
[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = "0.26"

[target.'cfg(target_os = "linux")'.dependencies]
# zbus on async-io, never tokio, in this crate (N10): AccessKit's Linux
# backend runs zbus on its own async-io executor, and zbus with `tokio` on
# panics there, which left screen readers without the window. The release
# builds the server (zbus with tokio) apart for the same reason, and CI
# holds this crate's zbus to it.
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
# N10: a phone's player as an MPRIS player (K7 on Linux), served by a small
# runtime of its own.
zbus = "5.7"
tokio = { workspace = true, features = ["rt", "sync"] }

[features]
snapshots = ["dep:egui_kittest"]

[dev-dependencies]
# C4: the app driven headless through AccessKit.
egui_kittest = { version = "=0.36.2", features = ["eframe"] }
# C7: a fixture answer's thumbnails, as the phone encodes them.
base64 = "0.22"
# PC7: the pointer lock's live test opens its window off the main thread
# (winit's event loop builder, as eframe's own).
winit = { version = "0.30", default-features = false }

