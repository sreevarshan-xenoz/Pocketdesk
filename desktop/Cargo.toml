[package]
name = "pocketdesk-desktop"
description = "Pocketdesk desktop app: pair phones, manage sessions and settings"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "pocketdesk"
path = "src/main.rs"

[dependencies]
linux-link-core = { path = "../core", default-features = false, features = ["local"] }
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
tray-icon = "0.26"
qrcode = { version = "0.14", default-features = false }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows.workspace = true
