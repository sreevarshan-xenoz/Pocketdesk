<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Pocketdesk</title>
  <defs>
    <linearGradient id="pd-left" x1="80" y1="220" x2="256" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5AD1FF"/>
      <stop offset="1" stop-color="#2F7BFF"/>
    </linearGradient>
    <linearGradient id="pd-right" x1="256" y1="230" x2="430" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2E8BFF"/>
      <stop offset="1" stop-color="#5B4BFF"/>
    </linearGradient>
    <linearGradient id="pd-back" x1="96" y1="180" x2="416" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="pd-rim" x1="150" y1="90" x2="380" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8FD8FF"/>
      <stop offset="1" stop-color="#7B6CFF"/>
    </linearGradient>
  </defs>

  <!-- The pocket's back wall, seen over the front's dipped opening. -->
  <path d="M104 236 Q104 204 136 200 L376 200 Q408 204 408 236 L408 262 L104 262 Z" fill="url(#pd-back)"/>

  <!-- The desktop window, tucked in and tilted. -->
  <g transform="rotate(9 266 216)">
    <rect x="152" y="86" width="228" height="256" rx="34" fill="#0B1222" stroke="url(#pd-rim)" stroke-width="12"/>
    <circle cx="204" cy="140" r="14" fill="#FF5F57"/>
    <circle cx="242" cy="140" r="14" fill="#FEBC2E"/>
    <circle cx="280" cy="140" r="14" fill="#28C840"/>
  </g>

  <!-- The pocket's front: two faces meeting at a soft centre fold. -->
  <path d="M84 238 Q84 214 108 220 L256 266 L256 462 Q240 462 224 456 L124 418 Q84 402 84 360 Z" fill="url(#pd-left)"/>
  <path d="M256 266 L404 220 Q428 214 428 238 L428 360 Q428 402 388 418 L288 456 Q272 462 256 462 Z" fill="url(#pd-right)"/>

  <!-- Light along the opening's edge, and a stitched seam. -->
  <path d="M92 226 L256 276 L420 226" fill="none" stroke="#B9ECFF" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M296 318 L404 284" fill="none" stroke="#C7D2FE" stroke-opacity="0.75" stroke-width="7" stroke-linecap="round" stroke-dasharray="16 14"/>
</svg>
