<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1280px; height: 400px; overflow: hidden; }
  body {
    background: radial-gradient(ellipse 60% 90% at 24% 55%, #16245e 0%, #0b1330 45%, #060a18 100%);
    font-family: 'Outfit', 'Segoe UI', sans-serif;
    display: flex; align-items: center; gap: 44px; padding-left: 110px; box-sizing: border-box;
  }
  .mark { width: 270px; height: 270px; filter: drop-shadow(0 18px 50px rgba(59,107,255,.45)); }
  h1 { margin: 0; font-size: 116px; font-weight: 800; letter-spacing: -2px; color: #fff; line-height: 1; }
  h1 span { background: linear-gradient(90deg, #3a8dff 0%, #6d5bff 70%, #9b5cff 100%);
            -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { margin: 22px 0 0 6px; font-size: 25px; font-weight: 500; letter-spacing: 13px; color: #c9d3ee; }
</style></head>
<body>
  <img class="mark" src="../pocketdesk-mark.svg" alt="">
  <div><h1>Pocket<span>desk</span></h1><p>YOUR DESKTOP. ANYWHERE.</p></div>
</body></html>
